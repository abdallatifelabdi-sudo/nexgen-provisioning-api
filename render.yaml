services:
  - type: web
    name: nexgen-provisioning-api
    env: docker
    region: ohio
    plan: free
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: API_GATEWAY_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: GHL_API_KEY
        sync: false
      - key: GHL_ENTERPRISE_SNAPSHOT_ID
        sync: false
      - key: MAKE_WEBHOOK_URL
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: CLICKUP_API_KEY
        sync: false
      - key: CLICKUP_LIST_ID
        sync: false
      - key: ENGINEER_EMAIL
        value: engineering@nexgenaisolutions.com
